name: FoldPipe CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .
        
    - name: Lint with flake8
      run: |
        pip install flake8
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        
    - name: Run tests
      run: |
        pip install pytest pytest-mock
        python -m pytest -v tests/

    - name: Validate release distributions
      if: matrix.python-version == '3.11'
      run: |
        pip install build twine
        python -m build
        python -m twine check dist/*

  wheel-smoke-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Build wheel
      run: |
        python -m pip install --upgrade pip build
        python -m build

    - name: Smoke test in clean venv
      run: |
        python -m venv /tmp/foldpipe-test
        source /tmp/foldpipe-test/bin/activate
        pip install dist/*.whl
        python - <<'PY'
        from foldpipe import AsyncFoldPipeLoader
        from foldpipe.sources import SyntheticLatencySource
        loader = AsyncFoldPipeLoader(
            SyntheticLatencySource(num_chunks=2, latency_ms=0, chunk_size=20),
            batch_size=5,
        )
        assert len(list(loader)) == 8
        print("wheel smoke test passed")
        PY
