name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  pypi-publish:
    name: Build and publish release to PyPI
    runs-on: ubuntu-latest
    
    # Specifies the environment for Trusted Publishing
    environment:
      name: pypi
      url: https://pypi.org/p/foldpipe
      
    permissions:
      # IMPORTANT: this permission is mandatory for Trusted Publishing (OIDC)
      id-token: write
      contents: read
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install build dependencies
        run: python -m pip install --upgrade pip build

      - name: Build package (sdist and wheel)
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No password or token needed because of PyPI Trusted Publishing!
